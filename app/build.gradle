plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skipads'
    compileSdk 35

    defaultConfig {
        applicationId 'com.skipads'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 螢幕截圖文字辨識（中文 + 英文），模型內建於 APK，不需網路
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
